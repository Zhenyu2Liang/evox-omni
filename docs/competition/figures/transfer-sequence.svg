<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1490" viewBox="0 0 1920 1490" role="img" aria-labelledby="title desc">
<title id="title">转账请求执行时序</title>
<desc id="desc">用户通过Web或微信提出转账，并通过同一渠道核对原操作、确认或验证。银行智能体提出操作，安全网关保存原操作、认领执行权并复核风险。需要追加验证与满足授权条件为互斥分支。业务结果经渠道展示给用户。实线为请求，蓝色虚线为返回。</desc>
