<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
<title id="title">原操作授权与执行状态</title>
<desc id="desc">待确认可升级为待验证。确认或验证通过后认领执行权并复核业务。验证第1、2次错误保持待验证，第3次错误锁定。取消与锁定为原操作终态；执行结果区分已执行、确定未提交的失败与结果未知的待核对。</desc>
<defs><style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#000000}.wire{fill:none;stroke:#64748B;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.node{fill:none;stroke:#64748B;stroke-width:2}</style>
<marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 L4 6 Z" fill="#64748B"/></marker></defs>
<defs><marker id="response-arrow" viewBox="0 0 24 24" refX="23" refY="12" markerWidth="24" markerHeight="24" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L23 12 L1 23 L6 12 Z" fill="#4D8CA9"/></marker><linearGradient id="browser-surface" x2="0" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#E7F1F7"/></linearGradient><linearGradient id="robot-surface" x2="0" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#DDD9EF"/></linearGradient><linearGradient id="bank-surface" x2="0" y2="1"><stop stop-color="#E3F3EB"/><stop offset="1" stop-color="#A9CFC0"/></linearGradient></defs>
<rect x="80" y="40" width="300" height="100" rx="14" fill="#FBF4E7" stroke="#B28A4E" stroke-width="2.4"/>
<g transform="translate(98 58) scale(0.64)"><ellipse cx="50" cy="94" rx="35" ry="4" fill="#59401D" opacity=".09"/><path d="M53 8 L91 22 V48 Q91 73 53 94 Q15 73 15 48 V22 Z" fill="#DCC69D"/><path d="M47 3 L84 17 V44 Q84 69 47 89 Q10 69 10 44 V17 Z" fill="#F4E4C3" stroke="#B28A4E" stroke-width="2"/><path d="M47 14 L74 24 V44 Q74 62 47 78 Q20 62 20 44 V24 Z" fill="#FFFFFF" opacity=".84"/><path d="M31 43 L43 55 L65 32" fill="none" stroke="#B28A4E" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="272" y="100" font-size="28" font-weight="600" text-anchor="middle" style="fill:#000000">待确认</text>
<rect x="500" y="40" width="300" height="100" rx="14" fill="#F0EFF7" stroke="#787499" stroke-width="2.4"/>
<text x="650" y="80" font-size="28" font-weight="600" text-anchor="middle" style="fill:#000000">已授权 · 待执行</text>
<text x="650" y="120" font-size="28" font-weight="400" text-anchor="middle" style="fill:#000000">认领执行权并复核</text>
<rect x="900" y="40" width="260" height="100" rx="14" fill="#EDF6F1" stroke="#3D8277" stroke-width="2.4"/>
<text x="1030" y="80" font-size="28" font-weight="600" text-anchor="middle" style="fill:#000000">已执行</text>
<text x="1030" y="120" font-size="28" font-weight="400" text-anchor="middle" style="fill:#000000">事务与回执已保存</text>
<rect x="80" y="300" width="300" height="100" rx="14" fill="#FBF4E7" stroke="#B28A4E" stroke-width="2.4"/>
<text x="230" y="340" font-size="28" font-weight="600" text-anchor="middle" style="fill:#000000">待验证</text>
<text x="230" y="380" font-size="28" font-weight="400" text-anchor="middle" style="fill:#000000">绑定原操作与挑战</text>
<rect x="900" y="300" width="260" height="100" rx="14" fill="#F2F4F5" stroke="#87939B" stroke-width="2.4"/>
<text x="1030" y="340" font-size="28" font-weight="600" text-anchor="middle" style="fill:#000000">已失败</text>
<text x="1030" y="380" font-size="28" font-weight="400" text-anchor="middle" style="fill:#000000">确认业务未提交</text>
<rect x="80" y="600" width="300" height="100" rx="14" fill="#F2F4F5" stroke="#87939B" stroke-width="2.4"/>
<text x="230" y="640" font-size="28" font-weight="600" text-anchor="middle" style="fill:#000000">已取消</text>
<text x="230" y="680" font-size="28" font-weight="400" text-anchor="middle" style="fill:#000000">原操作终态</text>
<rect x="900" y="600" width="260" height="100" rx="14" fill="#FBF4E7" stroke="#B28A4E" stroke-width="2.4"/>
<text x="1030" y="640" font-size="28" font-weight="600" text-anchor="middle" style="fill:#000000">待核对</text>
<text x="1030" y="680" font-size="28" font-weight="400" text-anchor="middle" style="fill:#000000">无法确定是否提交</text>
<rect x="500" y="600" width="300" height="100" rx="14" fill="#F2F4F5" stroke="#87939B" stroke-width="2.4"/>
<text x="650" y="640" font-size="28" font-weight="600" text-anchor="middle" style="fill:#000000">已锁定</text>
<text x="650" y="680" font-size="28" font-weight="400" text-anchor="middle" style="fill:#000000">原操作终态</text>
<path class="wire" d="M380 90 H500" marker-end="url(#arrow)"/>
<text x="440" y="72" font-size="28" font-weight="400" text-anchor="middle" style="fill:#000000">确认通过</text>
<path class="wire" d="M230 140 V300" marker-end="url(#arrow)"/>
<text x="250" y="230" font-size="28" font-weight="400" text-anchor="start" style="fill:#000000">风险升级</text>
<path class="wire" d="M380 340 H440 V120 H500" marker-end="url(#arrow)"/>
<text x="460" y="235" font-size="28" font-weight="400" text-anchor="start" style="fill:#000000">验证通过</text>
<path class="wire" d="M80 90 H24 V650 H80" marker-end="url(#arrow)"/>
<text x="34" y="265" font-size="28" font-weight="400" text-anchor="start" style="fill:#000000">取消</text>
<path class="wire" d="M230 400 V600" marker-end="url(#arrow)"/>
<text x="250" y="535" font-size="28" font-weight="400" text-anchor="start" style="fill:#000000">取消</text>
<path class="wire" d="M80 350 H52 V450 H130 V400" marker-end="url(#arrow)"/>
<text x="48" y="490" font-size="28" font-weight="400" text-anchor="start" style="fill:#000000">第 1、2 次</text>
<text x="48" y="530" font-size="28" font-weight="400" text-anchor="start" style="fill:#000000">验证错误</text>
<path class="wire" d="M380 375 H650 V600" marker-end="url(#arrow)"/>
<text x="675" y="510" font-size="28" font-weight="400" text-anchor="start" style="fill:#000000">第 3 次错误</text>
<path class="wire" d="M800 90 H850"/>
<path class="wire" d="M850 90 H900" marker-end="url(#arrow)"/>
<path class="wire" d="M850 90 V350 H900" marker-end="url(#arrow)"/>
<path class="wire" d="M850 350 V650 H900" marker-end="url(#arrow)"/>
</svg>
