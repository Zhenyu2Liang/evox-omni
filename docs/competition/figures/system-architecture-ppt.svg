<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="960" viewBox="0 0 1920 960" role="img" aria-labelledby="title desc">
<title id="title">系统总体架构（PPT 版）</title>
<desc id="desc">透明画布上的插画分组架构。文字统一字号和黑色，模块标题加粗，说明与连接标注采用常规字重。模块颜色区分职责，粗灰箭头表示请求与执行，蓝色虚线表示结果与状态经服务接口返回Web或微信。页面办理独立校验，智能体经过安全网关，两者共用银行业务工具库。</desc>
