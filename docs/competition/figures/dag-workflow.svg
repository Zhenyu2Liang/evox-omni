<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" role="img" aria-labelledby="title desc">
<title id="title">条件任务 DAG 与确认门控</title>
<desc id="desc">查询结果进入用户指定条件。条件为真时提出限额调整并等待确认后执行，为假时跳过调整。其他独立步骤按声明顺序处理。</desc>
<defs>
<style>text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",Arial,sans-serif} .wire{fill:none;stroke-linecap:round;stroke-linejoin:round}</style>
<marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#25343A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#65737A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#BB563F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#32786E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#547A96" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#996D2C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#77858C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="0" y="0" width="1440" height="980" rx="0" fill="#FBFAF7"/>
<rect x="48" y="39" width="47" height="47" rx="13" fill="#BB563F"/>
<text x="71.5" y="70" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">03</text>
<text x="112" y="75" font-size="34" font-weight="700" fill="#25343A" text-anchor="start">条件任务 DAG 与确认门控</text>
<text x="1368" y="62" font-size="21" font-weight="700" fill="#25343A" text-anchor="end">万象柜坊</text>
<text x="1368" y="87" font-size="15" font-weight="600" fill="#65737A" text-anchor="end">EvoX Omni</text>
<text x="112" y="109" font-size="18" font-weight="400" fill="#65737A" text-anchor="start">示例：本月消费超过指定金额时，调整分类消费限额</text>
<path class="wire" d="M48 135 L1392 135" stroke="#D9DEDC" stroke-width="1"/>
<path class="wire" d="M48 135 L140 135" stroke="#BB563F" stroke-width="3"/>
<rect x="66" y="164" width="106" height="30" rx="8" fill="#EDF3F7"/>
<text x="119.0" y="185" font-size="16" font-weight="600" fill="#547A96" text-anchor="middle">查询与条件</text>
<rect x="246" y="164" width="90" height="30" rx="8" fill="#FAEDE7"/>
<text x="291.0" y="185" font-size="16" font-weight="600" fill="#BB563F" text-anchor="middle">用户授权</text>
<rect x="405" y="164" width="106" height="30" rx="8" fill="#EAF4F0"/>
<text x="458.0" y="185" font-size="16" font-weight="600" fill="#32786E" text-anchor="middle">持久化结果</text>
<path class="wire" d="M347 423 L422 423" stroke="#547A96" stroke-width="2" marker-end="url(#a-blue)"/>
<path class="wire" d="M702 423 L745 423 L745 310 L790 310" stroke="#547A96" stroke-width="2" marker-end="url(#a-blue)"/>
<text x="758" y="395" font-size="18" font-weight="600" fill="#547A96" text-anchor="start">是</text>
<path class="wire" d="M562 503 L562 550 L790 550" stroke="#77858C" stroke-width="2" marker-end="url(#a-gray)"/>
<text x="583" y="537" font-size="18" font-weight="600" fill="#65737A" text-anchor="start">否</text>
<path class="wire" d="M1025 310 L1090 310" stroke="#BB563F" stroke-width="2" marker-end="url(#a-red)"/>
<path class="wire" d="M1207 365 L1207 500" stroke="#32786E" stroke-width="2" marker-end="url(#a-teal)"/>
<text x="1227" y="435" font-size="18" font-weight="600" fill="#32786E" text-anchor="start">确认通过</text>
<path class="wire" d="M223 478 L223 718 L790 718" stroke="#77858C" stroke-width="2" marker-end="url(#a-gray)"/>
<text x="388" y="701" font-size="18" font-weight="400" fill="#65737A" text-anchor="start">其他独立步骤</text>
<rect x="100" y="368" width="247" height="110" rx="16" fill="#FFFFFF" stroke="#D9DEDC" stroke-width="1"/>
<rect x="101" y="385" width="4" height="76" rx="2" fill="#547A96"/>
<text x="122" y="402" font-size="23" font-weight="600" fill="#25343A" text-anchor="start">查询本月消费</text>
<text x="122" y="431" font-size="18" font-weight="400" fill="#65737A" text-anchor="start">返回结构化消费结果</text>
<text x="122" y="456" font-size="18" font-weight="400" fill="#65737A" text-anchor="start">读取节点</text>
<path d="M562 343 L702 423 L562 503 L422 423 Z" fill="#EDF3F7" stroke="#A7BCC9" stroke-width="1.5"/>
<text x="562" y="414" font-size="21" font-weight="600" fill="#547A96" text-anchor="middle">消费金额是否超过</text>
<text x="562" y="446" font-size="21" font-weight="600" fill="#547A96" text-anchor="middle">用户指定阈值？</text>
<rect x="790" y="255" width="235" height="110" rx="16" fill="#FFFFFF" stroke="#D9DEDC" stroke-width="1"/>
<rect x="791" y="272" width="4" height="76" rx="2" fill="#547A96"/>
<text x="812" y="289" font-size="23" font-weight="600" fill="#25343A" text-anchor="start">提出限额调整</text>
<text x="812" y="318" font-size="18" font-weight="400" fill="#65737A" text-anchor="start">生成原操作记录</text>
<text x="812" y="343" font-size="18" font-weight="400" fill="#65737A" text-anchor="start">写入尚未执行</text>
<rect x="1090" y="255" width="235" height="110" rx="16" fill="#FAEDE7" stroke="#D9DEDC" stroke-width="1"/>
<text x="1207.5" y="297" font-size="24" font-weight="600" fill="#BB563F" text-anchor="middle">等待用户确认</text>
<text x="1207.5" y="330" font-size="18" font-weight="400" fill="#65737A" text-anchor="middle">黄色权限 · 挂起节点</text>
<rect x="1090" y="500" width="235" height="110" rx="16" fill="#FFFFFF" stroke="#D9DEDC" stroke-width="1"/>
<rect x="1091" y="517" width="4" height="76" rx="2" fill="#32786E"/>
<text x="1112" y="534" font-size="23" font-weight="600" fill="#25343A" text-anchor="start">执行并保存结果</text>
<text x="1112" y="563" font-size="18" font-weight="400" fill="#65737A" text-anchor="start">关联原操作与节点</text>
<text x="1112" y="588" font-size="18" font-weight="400" fill="#65737A" text-anchor="start">恢复后续执行</text>
<rect x="790" y="500" width="235" height="110" rx="16" fill="#FFFFFF" stroke="#D9DEDC" stroke-width="1"/>
<rect x="791" y="517" width="4" height="76" rx="2" fill="#77858C"/>
<text x="812" y="534" font-size="23" font-weight="600" fill="#25343A" text-anchor="start">跳过调整节点</text>
<text x="812" y="563" font-size="18" font-weight="400" fill="#65737A" text-anchor="start">条件不成立</text>
<text x="812" y="588" font-size="18" font-weight="400" fill="#65737A" text-anchor="start">不创建调整授权</text>
<rect x="790" y="663" width="535" height="110" rx="16" fill="#FFFFFF" stroke="#D9DEDC" stroke-width="1"/>
<rect x="791" y="680" width="4" height="76" rx="2" fill="#77858C"/>
<text x="812" y="697" font-size="23" font-weight="600" fill="#25343A" text-anchor="start">处理其他独立步骤</text>
<text x="812" y="726" font-size="18" font-weight="400" fill="#65737A" text-anchor="start">遵循原图和声明顺序，仍逐节点校验权限</text>
<rect x="100" y="815" width="1225" height="69" rx="12" fill="#EAF4F0"/>
<text x="120" y="843" font-size="18" font-weight="600" fill="#32786E" text-anchor="start">恢复原则</text>
<text x="120" y="867" font-size="17" font-weight="400" fill="#65737A" text-anchor="start">已成功节点不重复执行；确认前不执行写入；暂停与取消在安全检查点生效。</text>
<path class="wire" d="M48 906 L1392 906" stroke="#D9DEDC" stroke-width="1"/>
<text x="48" y="934" font-size="16" font-weight="400" fill="#65737A" text-anchor="start">边表示依赖与顺序；条件只使用已返回的结构化字段，不由模型补造业务阈值。</text>
<text x="1392" y="934" font-size="15" font-weight="400" fill="#65737A" text-anchor="end">EvoX Omni  /  技术与安全</text>
</svg>
