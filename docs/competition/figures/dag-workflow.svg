<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1060" viewBox="0 0 960 1060" role="img" aria-labelledby="title desc">
<title id="title">条件任务 DAG 与确认门控</title>
<desc id="desc">查询本月消费并比较用户指定阈值。条件满足时创建原操作，等待用户确认后执行并保存结果；条件不满足时跳过调整。两条路径均结束本条件分支。</desc>
<defs><style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#000000}.wire{fill:none;stroke:#64748B;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.node{fill:none;stroke:#64748B;stroke-width:2}</style>
<marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 L4 6 Z" fill="#64748B"/></marker></defs>
<defs><marker id="response-arrow" viewBox="0 0 24 24" refX="23" refY="12" markerWidth="24" markerHeight="24" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L23 12 L1 23 L6 12 Z" fill="#4D8CA9"/></marker><linearGradient id="browser-surface" x2="0" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#E7F1F7"/></linearGradient><linearGradient id="robot-surface" x2="0" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#DDD9EF"/></linearGradient><linearGradient id="bank-surface" x2="0" y2="1"><stop stop-color="#E3F3EB"/><stop offset="1" stop-color="#A9CFC0"/></linearGradient></defs>
<rect x="60" y="20" width="400" height="90" rx="14" fill="#ECF4F8" stroke="#487B9A" stroke-width="2.4"/>
<text x="260" y="55" font-size="28" font-weight="600" text-anchor="middle" style="fill:#000000">查询本月消费</text>
<text x="260" y="95" font-size="28" font-weight="400" text-anchor="middle" style="fill:#000000">返回结构化结果</text>
<path class="wire" d="M260 110 V155" marker-end="url(#arrow)"/>
<path class="node" d="M260 155 L455 255 L260 355 L65 255 Z" style="fill:#F0EFF7;stroke:#787499"/>
<text x="260" y="244" font-size="28" font-weight="600" text-anchor="middle" style="fill:#000000">消费金额是否超过</text>
<text x="260" y="284" font-size="28" font-weight="600" text-anchor="middle" style="fill:#000000">用户指定阈值？</text>
<path class="wire" d="M260 355 V420" marker-end="url(#arrow)"/>
<text x="285" y="387" font-size="28" font-weight="400" text-anchor="start" style="fill:#000000">是</text>
<path class="wire" d="M455 255 H770 V420" marker-end="url(#arrow)"/>
<text x="510" y="238" font-size="28" font-weight="400" text-anchor="middle" style="fill:#000000">否</text>
<rect x="60" y="420" width="400" height="100" rx="14" fill="#F0EFF7" stroke="#787499" stroke-width="2.4"/>
<text x="260" y="460" font-size="28" font-weight="600" text-anchor="middle" style="fill:#000000">提出限额调整</text>
<text x="260" y="500" font-size="28" font-weight="400" text-anchor="middle" style="fill:#000000">保存原操作，尚未执行</text>
<rect x="640" y="420" width="260" height="100" rx="14" fill="#F2F4F5" stroke="#87939B" stroke-width="2.4"/>
<text x="770" y="460" font-size="28" font-weight="600" text-anchor="middle" style="fill:#000000">跳过调整</text>
<text x="770" y="500" font-size="28" font-weight="400" text-anchor="middle" style="fill:#000000">不创建调整授权</text>
<path class="wire" d="M260 520 V600" marker-end="url(#arrow)"/>
<rect x="60" y="600" width="400" height="100" rx="14" fill="#FBF4E7" stroke="#B28A4E" stroke-width="2.4"/>
<text x="260" y="640" font-size="28" font-weight="600" text-anchor="middle" style="fill:#000000">等待用户确认</text>
<text x="260" y="680" font-size="28" font-weight="400" text-anchor="middle" style="fill:#000000">挂起当前节点</text>
<path class="wire" d="M260 700 V780" marker-end="url(#arrow)"/>
<text x="285" y="747" font-size="28" font-weight="400" text-anchor="start" style="fill:#000000">确认通过</text>
<rect x="60" y="780" width="400" height="100" rx="14" fill="#EDF6F1" stroke="#3D8277" stroke-width="2.4"/>
<text x="260" y="820" font-size="28" font-weight="600" text-anchor="middle" style="fill:#000000">执行并保存结果</text>
<text x="260" y="860" font-size="28" font-weight="400" text-anchor="middle" style="fill:#000000">关联原操作与节点</text>
<path class="wire" d="M260 880 V960" marker-end="url(#arrow)"/>
<path class="wire" d="M770 520 V1000 H460" marker-end="url(#arrow)"/>
<rect x="60" y="960" width="400" height="80" rx="14" fill="#F2F4F5" stroke="#87939B" stroke-width="2.4"/>
<text x="260" y="1010" font-size="28" font-weight="600" text-anchor="middle" style="fill:#000000">结束本条件分支</text>
</svg>
