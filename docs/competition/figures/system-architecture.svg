<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1760" viewBox="0 0 1600 1760" role="img" aria-labelledby="title desc">
<title id="title">系统总体架构（文档版）</title>
<desc id="desc">按仓库实现绘制的技术组件架构。Web 通过 JSON / SSE，微信通道通过 HTTP JSON 使用 Next.js API。对话进入持久化 Agent 运行时；操作与任务 API 进入确认、验证与工作流控制，页面业务独立校验。Pi Agent Core 使用模型适配器、上下文压缩、工具注册及参数校验；运行日志保存事件、检查点与租约，事件提交后才对外发布。单步工具与 DAG 节点均经过安全网关，受控写入通过命令事务、幂等回执与必需审计执行。运行恢复进程与定时任务调度独立启动，定时付款仍生成需授权的工作流。所有服务使用共享仓储与 Prisma / SQLite 持久化；存储层表示共同依赖，不逐一画出读写连接。双向箭头包含请求与结果返回。</desc>
