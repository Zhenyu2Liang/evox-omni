allowBuilds:
  '@google/genai': false
  '@prisma/engines': true
  better-sqlite3: true
  esbuild: true
  prisma: true
  protobufjs: false
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@next/env@16.4.3'
  - '@next/eslint-plugin-next@16.4.3'
  - '@next/swc-darwin-arm64@16.4.3'
  - '@next/swc-darwin-x64@16.4.3'
  - '@next/swc-linux-arm64-gnu@16.4.3'
  - '@next/swc-linux-arm64-musl@16.4.3'
  - '@next/swc-linux-x64-gnu@16.4.3'
  - '@next/swc-linux-x64-musl@16.4.3'
  - '@next/swc-win32-arm64-msvc@16.4.3'
  - '@next/swc-win32-x64-msvc@16.4.3'
  - next@16.4.3
overrides:
  '@earendil-works/pi-agent-core': 1.2.0
  '@earendil-works/pi-ai': 1.2.0
  '@earendil-works/pi-codemode': 1.2.0
  '@earendil-works/pi-mcp': 1.2.0
  '@earendil-works/pi-tui': 1.2.0
  # Pin security patches while upstream packages retain their current dependency versions.
  'undici@8.10.2': 8.12.2
  'source-map-js@1.2.1': 1.2.2
  'fast-uri@3.1.8': 3.1.9

# 通道只使用 pi-weixinbot 的协议模块，不加载其旧版 Pi 扩展运行时。
packageExtensions:
  'pi-weixinbot@1.0.5':
    peerDependenciesMeta:
      '@mariozechner/pi-agent-core':
        optional: true
      '@mariozechner/pi-ai':
        optional: true
      '@mariozechner/pi-coding-agent':
        optional: true
patchedDependencies:
  pi-weixinbot@1.0.5: patches/pi-weixinbot@1.0.5.patch
